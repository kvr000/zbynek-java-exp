# Serverless Framework v3 deployment of the Lambda package
#
# Build:   mvn package          (builds standalone jar and target/lambda/function.zip)
# Deploy:  npx serverless deploy   (prints the HTTP API endpoint URL)
# Remove:  npx serverless remove

service: zbynek-lambda-snapstart-exp
frameworkVersion: '3'

plugins:
  - serverless-better-credentials

provider:
  name: aws
  runtime: java25
  region: us-west-2
  memorySize: 256
  timeout: 30
  architecture: arm64

package:
  artifact: target/zbynek-lambda-snapstart.jar

functions:
  currentTime:
    handler: com.github.kvr000.aws.lambda.snapstart.Handler
    events:
      - httpApi:
          path: /time
          method: get
    snapStart: true

