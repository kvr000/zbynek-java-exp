quarkus.http.port=8080
quarkus.http.test-port=8081

# dryuf-jackson is not a bean archive (no beans.xml / Jandex index), index it so SecureFieldWriter bean is discovered
quarkus.index-dependency.dryuf-jackson.group-id=net.dryuf
quarkus.index-dependency.dryuf-jackson.artifact-id=dryuf-jackson
# dryuf-quarkus is deliberately NOT indexed, its components are wired explicitly in container.DryufBeansExtension
# and container.IdentityContextBeans

# Client locale: language negotiated from Accept-Language, time zone and currency from
# "Prefer: timezone=<zone>, currency=<code>", domain is business identification (translations lookup)
app.locale.languages=en
app.locale.default-language=en
app.locale.default-time-zone=UTC
app.locale.currencies=EUR,USD,CZK
app.locale.default-currency=EUR
app.locale.default-domain=

#quarkus.jackson.mapper.sort-properties-alphabetically=false

# JWT verification: the token is read from the session cookie, falling back to "Authorization: Bearer" header
mp.jwt.verify.issuer=https://quarkus-secure-field.exp.kvr000.github.com
mp.jwt.verify.publickey.location=jwt/publicKey.pem
mp.jwt.token.header=Cookie
mp.jwt.token.cookie=qsf-token
smallrye.jwt.always-check-authorization=true

# JWT signing - demo key pair committed in resources, DO NOT use for anything real
smallrye.jwt.sign.key.location=jwt/privateKey.pem

# quarkus.package.jar.type is set in pom.xml (uber-jar by default, fast-jar for -Plambda)

quarkus.arc.remove-unused-beans=framework
quarkus.arc.enable-portable-extensions=true

# Logging: same layout as the Log4j2 console appender of common (time, thread, level, abbreviated logger, message);
# %s%e = message and exception, %c{1.} abbreviates packages like Log4j's %logger{36}
quarkus.log.level=INFO
quarkus.log.console.stderr=true
quarkus.log.console.format=%z{UTC}%d{yyyy-MM-dd'T'HH:mm:ss.SSS'Z'} [%t] %-5p %c{1.} - %s%e%n
quarkus.log.category."software.amazon.awssdk".level=WARN

quarkus.banner.enabled=false
