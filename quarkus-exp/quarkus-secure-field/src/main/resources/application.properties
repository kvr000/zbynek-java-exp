quarkus.http.port=8080
quarkus.http.test-port=8081

# dryuf-jackson is not a bean archive (no beans.xml / Jandex index), index it so SecureFieldWriter bean is discovered
quarkus.index-dependency.dryuf-jackson.group-id=net.dryuf
quarkus.index-dependency.dryuf-jackson.artifact-id=dryuf-jackson

quarkus.jackson.mapper.sort-properties-alphabetically=false

# JWT verification: the token is read from the session cookie, falling back to "Authorization: Bearer" header
mp.jwt.verify.issuer=https://quarkus-secure-field.exp.kvr000.github.com
mp.jwt.verify.publickey.location=jwt/publicKey.pem
mp.jwt.token.header=Cookie
mp.jwt.token.cookie=qsf-token
smallrye.jwt.always-check-authorization=true

# JWT signing - demo key pair committed in resources, DO NOT use for anything real
smallrye.jwt.sign.key.location=jwt/privateKey.pem

# java -jar target/quarkus-secure-field-0.0.1-runner.jar
quarkus.package.jar.type=uber-jar
